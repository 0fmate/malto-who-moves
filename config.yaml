# Single source of truth for paths and parameters.
# Paths can be overridden with env vars WHOMOVES_DATA_DIR, WHOMOVES_CACHE_DIR, WHOMOVES_OUTPUT_DIR.
# On Kaggle: data_dir = /kaggle/input/competitions/malto-who-moves, cache/output under /kaggle/working.

paths:
  data_dir: C:/Users/david/OneDrive/Desktop/MALTO CHALLENGE/data_code/malto-who-moves  # raw data, OUTSIDE this repo
  cache_dir: C:/Users/david/OneDrive/Desktop/MALTO CHALLENGE/data_code/cache  # detections, tracks, features (parquet), OUTSIDE this repo
  sample_dir: data_sample                                # small CSV heads, inside the repo
  output_dir: outputs                                    # submissions, figures

detector:
  # Options: fasterrcnn_resnet50_fpn_v2 (torchvision, BSD), fasterrcnn_mobilenet_v3_large_fpn (faster, weaker
  # on small objects), rtdetr (HF transformers, Apache-2.0; see hf_model / input_size).
  name: fasterrcnn_resnet50_fpn_v2
  score_threshold: 0.25              # keep low: far people are small and low-confidence
  frame_stride: 1                    # run on every N-th frame (videos are 10 fps)
  batch_size: 4                      # frames per GPU forward pass
  half: true                         # fp16 autocast on GPU (torchvision backends)
  min_size: null                     # torchvision: short side after resize (null = default 800)
  max_detections: 300                # per frame; parking lots have many cars
  tiles: null                        # e.g. [2, 2]: also detect on 2x2 overlapping enlarged crops (small objects)
  tile_overlap: 0.2                  # overlap between neighbouring tiles, as a share of a tile
  tile_merge_iou: 0.5                # NMS IoU when merging full-frame and tile boxes
  max_images_per_pass: 10            # images per GPU forward pass (tiles count as images)
  # hf_model: PekingU/rtdetr_r50vd_coco_o365   # rtdetr only
  # input_size: 640                            # rtdetr only, square input side
  # COCO class name -> competition class. Birds are not targets. The original COCO label is kept
  # in the "label" column, so mappings like bicycle -> person can be revisited without re-running.
  class_map:
    person: person
    bicycle: person        # a cyclist is a person
    car: vehicle
    motorcycle: vehicle
    bus: vehicle
    truck: vehicle
    cat: animal
    dog: animal
    horse: animal
    sheep: animal
    cow: animal

tracker:
  nms_iou: 0.7               # merge same-class duplicates (car + truck on one vehicle)
  high_score: 0.5            # detections above this are matched first
  new_track_score: 0.3       # minimum score to start a new track
  iou_threshold: 0.3         # minimum IoU between predicted and detected box
  center_gate: 0.7           # last round: max center distance, in box heights
  max_age_frames: 20         # keep a lost track alive for 2 s (10 fps)
  min_track_len: 3           # drop tracks with fewer detections
  velocity_smoothing: 0.3    # weight of the newest velocity in the moving average

matching:                    # predicted tracks <-> ground-truth tracks (training labels)
  iou_threshold: 0.3         # looser than 0.5: small boxes are offset by a few pixels
  min_share: 0.5             # a track takes the GT id it matches in >= 50% of its frames

motion:
  method: rule           # rule (pillar 3.4) or model (3.5, later)
  rule_theta: 2.0        # rule: moving once this many box heights away from the first position (tuned by eval_rule.py)
  confirm_rows: 5        # consecutive "moving" detections before raising an alarm (tuned by eval_rule.py)
  driver_inside: 0.7     # person boxes covered this much by a vehicle box never alarm

validation:
  n_folds: 3             # scene folds (scripts/scene_groups.py); folds never share a scene
